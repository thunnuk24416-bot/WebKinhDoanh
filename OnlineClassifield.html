<html>
<head>
    <title>Bài 49</title>
    <link rel="stylesheet" href="OnlineClassified.css">
    <script>
        function handleSearch() {
            alert("Đang thực hiện tìm kiếm dữ liệu...");
            return false;
        }

        function handleHelp() {
            window.open("help.html", "_blank", "width=500,height=400");
        }
    </script>
</head>
<body>

    <div class="form-container">
        <h1 class="form-title">Online Classifieds Search Form</h1>
        <hr class="divider">

        <form id="searchForm" onsubmit="return handleSearch();">
            
            <!-- Mục 1: Section Radio Options -->
            <div class="section">
                <p class="section-label">1&#41; Search for a classified in the following sections:</p>
                <div class="options-grid grid-2-col">
                    <label><input type="radio" name="section" value="employment"> Employment</label>
                    <label><input type="radio" name="section" value="personal"> Personal</label>
                    
                    <label><input type="radio" name="section" value="forsale" checked> For Sale</label>
                    <label><input type="radio" name="section" value="miscellaneous"> Miscellaneous</label>
                    
                    <label><input type="radio" name="section" value="housing"> Housing</label>
                    <label><input type="radio" name="section" value="all"> All of the above</label>
                </div>
            </div>

            <!-- Mục 2: Publication Checkbox Options -->
            <div class="section">
                <p class="section-label">2&#41; Search the following publications:</p>
                <div class="options-grid grid-3-col">
                    <label><input type="checkbox" name="publication" value="midwest" checked> Midwest times</label>
                    <label><input type="checkbox" name="publication" value="modern"> Modern News</label>
                    <label><input type="checkbox" name="publication" value="employment_today"> Employment Today</label>

                    <label><input type="checkbox" name="publication" value="great_lakes" checked> Great Lakes Classifieds</label>
                    <label><input type="checkbox" name="publication" value="middleton"> Middleton Daily</label>
                    <label><input type="checkbox" name="publication" value="cashtown"> Cashtown Daily News</label>
                </div>
            </div>

            <!-- Mục 3: Date Inputs -->
            <div class="section">
                <div class="date-row">
                    <span class="section-label">3&#41; From to</span>
                    <input type="text" name="fromDate" placeholder="mm/dd/yy" class="date-input">
                    <span class="section-label">to</span>
                    <input type="text" name="toDate" placeholder="mm/dd/yy" class="date-input">
                    <span class="section-label">.</span>
                </div>
            </div>

            <!-- Mục 4: Keywords Input -->
            <div class="section">
                <p class="section-label">4&#41; Enter a few keywords to describe the classified.</p>
                <input type="text" name="keywords" class="keyword-input">
            </div>

            <!-- Mục 5: 3 Buttons -->
            <div class="section">
                <p class="section-label">5&#41; Click one of the options below:</p>
                <div class="action-buttons">
                    <!-- Search Button -->
                    <button type="submit" class="btn-action">
                        <img src="Search.gif" alt="Search">
                    </button>

                    <!-- Help Button -->
                    <button type="button" class="btn-action" onclick="handleHelp()">
                        <img src="Help.gif" alt="Help">
                    </button>

                    <!-- Cancel / Reset Button -->
                    <button type="reset" class="btn-action">
                        <img src="Cancel.gif" alt="Cancel">
                    </button>
                </div>
            </div>

        </form>
    </div>

</body>
</html>
